[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geargarage-trainplat_jd001"
version = "0.1.0"
description = "在同一个输入里两两比对，检测大模型训练平台工程师·批处理调度与吞吐折中相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "geargarage" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://geargarage.github.io"
Repository = "https://github.com/geargarage/trainplat_jd001"
Issues = "https://github.com/geargarage/trainplat_jd001/issues"

[project.scripts]
trainplat_jd001 = "trainplat_jd001:main"

[tool.setuptools]
py-modules = ["trainplat_jd001"]
